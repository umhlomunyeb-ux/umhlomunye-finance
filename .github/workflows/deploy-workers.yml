name: Deploy LMS Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      matrix:
        include:
          - worker: umhlomunye-finance2
            url_secret: UMHLOMUNYE_SUPABASE_URL
            key_secret: UMHLOMUNYE_SUPABASE_PUBLISHABLE_KEY
            app_secret: UMHLOMUNYE_PUBLIC_APP_URL
          - worker: umthaniya-finance
            url_secret: UMTHANIYA_SUPABASE_URL
            key_secret: UMTHANIYA_SUPABASE_PUBLISHABLE_KEY
            app_secret: UMTHANIYA_PUBLIC_APP_URL
          - worker: tloube-finance
            url_secret: TLOUBE_SUPABASE_URL
            key_secret: TLOUBE_SUPABASE_PUBLISHABLE_KEY
            app_secret: TLOUBE_PUBLIC_APP_URL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      VITE_SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets[matrix.key_secret] }}
      VITE_PUBLIC_APP_URL: ${{ secrets[matrix.app_secret] }}
      VITE_APP_MODE: online
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --name "${{ matrix.worker }}"
