name: Deploy Umhlomunye Finance Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      VITE_SUPABASE_URL: ${{ secrets.UMHLOMUNYE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.UMHLOMUNYE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PUBLIC_APP_URL: ${{ secrets.UMHLOMUNYE_PUBLIC_APP_URL }}
      VITE_APP_MODE: online
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --name "umhlomunye-finance2"
